name: smallbiz_accounts
description: A small business accounting app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Storage (SQLite)
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Firebase & Auth
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  cloud_firestore: ^4.15.0   # check latest version on pub.dev
  connectivity_plus: ^6.0.0

  # Utilities
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: any

  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/lang/